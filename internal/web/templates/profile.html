{{define "profile.html"}}{{template "header" .}}
<h1>Private data</h1>
{{/* TODO(feature/frontend): prefill from .Profile, add an algorithm selector
     that reloads with ?alg=aes|des|rc4, and show validation errors. */}}
<form method="post" action="/profile" class="stack">
  <label>Full name <input name="full_name" required maxlength="100"></label>
  <label>NIK <input name="nik" inputmode="numeric" required pattern="[0-9]{16}"></label>
  <label>Date of birth <input name="date_of_birth" type="date" required></label>
  <label>Address <textarea name="address" required maxlength="300"></textarea></label>
  <label>Phone <input name="phone" inputmode="numeric" required pattern="[0-9]{9,15}"></label>
  <label>Email <input name="email" type="email" required maxlength="254"></label>
  <button type="submit">Save</button>
</form>
{{template "footer" .}}{{end}}
